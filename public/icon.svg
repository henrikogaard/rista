<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="256" height="256" fill="#0d0e10"/>

  <!-- Gradient definition (teal to purple) -->
  <defs>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#20c997;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5b7fa6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Chart line with trend -->
  <path d="M 40 180 L 90 120 L 140 140 L 180 80 L 220 140"
        fill="none"
        stroke="url(#lineGradient)"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>