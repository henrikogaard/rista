name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Preflight release configuration
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in \
            DEVELOPER_ID_P12 \
            DEVELOPER_ID_P12_PASSWORD \
            APPSTORE_API_PRIVATE_KEY \
            SPARKLE_PRIVATE_ED_KEY \
            APPLE_TEAM_ID \
            APPSTORE_API_KEY_ID \
            APPSTORE_ISSUER_ID
          do
            test -n "${!name:-}" || {
              echo "Missing required release configuration: ${name}" >&2
              exit 1
            }
          done

          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v${cargo_version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${cargo_version}" >&2
            exit 1
          }

      - name: Import release signing credentials
        id: signing
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077

          keychain_path="${RUNNER_TEMP}/rista-signing.keychain-db"
          p12_path="${RUNNER_TEMP}/developer-id.p12"
          api_key_path="${RUNNER_TEMP}/AuthKey.p8"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::${keychain_password}"

          printf '%s' "${DEVELOPER_ID_P12}" | /usr/bin/base64 -D >"${p12_path}"
          if [[ "${APPSTORE_API_PRIVATE_KEY}" == "-----BEGIN PRIVATE KEY-----"* ]]; then
            printf '%s' "${APPSTORE_API_PRIVATE_KEY}" >"${api_key_path}"
          else
            printf '%s' "${APPSTORE_API_PRIVATE_KEY}" | /usr/bin/base64 -D >"${api_key_path}"
          fi
          grep -Eq '^-----BEGIN PRIVATE KEY-----\r?$' "${api_key_path}" || {
            echo "APPSTORE_API_PRIVATE_KEY is not a PEM private key" >&2
            exit 1
          }

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${p12_path}" \
            -k "${keychain_path}" \
            -P "${DEVELOPER_ID_P12_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

          identity="$(
            security find-identity -v -p codesigning "${keychain_path}" \
              | awk -v team="(${APPLE_TEAM_ID})" \
                '/"Developer ID Application: / && index($0, team) { print $2; exit }'
          )"
          [[ "${identity}" =~ ^[A-Fa-f0-9]{40}$ ]] || {
            echo "No Developer ID Application identity matches APPLE_TEAM_ID" >&2
            exit 1
          }

          echo "identity=${identity}" >>"${GITHUB_OUTPUT}"
          echo "api_key_path=${api_key_path}" >>"${GITHUB_OUTPUT}"

      - name: Authenticate with the notary service
        env:
          APPSTORE_API_KEY_PATH: ${{ steps.signing.outputs.api_key_path }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool history \
            --key "${APPSTORE_API_KEY_PATH}" \
            --key-id "${APPSTORE_API_KEY_ID}" \
            --issuer "${APPSTORE_ISSUER_ID}" \
            --output-format json >/dev/null

      - name: Vendor Sparkle
        run: scripts/fetch-sparkle.sh

      - name: Build, sign, notarize, and package
        env:
          VERSION: ${{ github.ref_name }}
          NOTARIZE: "1"
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPSTORE_API_KEY_PATH: ${{ steps.signing.outputs.api_key_path }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: scripts/bundle-macos.sh

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release create "${TAG}" \
            --title "Rísta ${TAG}" \
            --generate-notes \
            "dist/Rista-${version}.zip" \
            "dist/Rista-${version}.dmg" \
            dist/SHA256SUMS \
            dist/appcast.xml

      - name: Remove release signing credentials
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/rista-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "${RUNNER_TEMP}/developer-id.p12" \
            "${RUNNER_TEMP}/AuthKey.p8" \
            "${RUNNER_TEMP}/rista-signing.keychain-db"
