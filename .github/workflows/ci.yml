name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      # The binary target is warning-free; the test targets carry a handful of
      # pre-existing lint warnings that are not yet part of the gate.
      - name: Clippy (binary)
        run: cargo clippy -- -D warnings

      - name: Tests
        run: cargo test