[package]
name = "rista"
version = "0.2.0"
description = "A local-first Markdown editor. Carved cleanly."
edition = "2021"
license = "MIT"
publish = false

[dependencies]
gpui-kit = { version = "0.7.0", features = [
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
] }
markdown = { version = "1.0.0", features = ["serde"] }
notify = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
chrono = "0.4"
smol = "2"
anyhow = "1"
base64 = "0.22"
ureq = "3.4.2"

[profile.release]
lto = "thin"
codegen-units = 1
