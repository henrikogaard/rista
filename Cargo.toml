[package]
name = "rista"
version = "0.1.7"
description = "A local-first Markdown editor. Carved cleanly."
edition = "2021"
license = "MIT"
publish = false

[dependencies]
gpui-kit = { version = "0.7.0", features = [
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
] }
markdown = { version = "1.0.0", features = ["serde"] }
notify = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
directories = "6"
chrono = "0.4"
smol = "2"
anyhow = "1"
base64 = "0.22"
ureq = "3.4.2"
lsp-types = { version = "0.97.0", features = ["proposed"] }
url = "2"
portable-pty = "0.8.1"
vt100 = "0.15.2"

[features]
# Links vendor/sparkle/Sparkle.framework and enables the Sparkle updater
# (macOS .app builds via scripts/bundle-macos.sh).
sparkle = []

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSImage",
    "NSResponder",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSData",
    "NSDictionary",
    "NSObject",
    "NSString",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

# Test-only: point gpui-kit at the inline <mark> fix. gpui-pre stays on
# crates.io so it follows the pin that branch was built against (=0.3.8).
[patch.crates-io]
gpui-kit = { git = "https://github.com/henrikogaard/gpui-kit", branch = "cursor/inline-html-mark-0bc0" }
gpui-base = { git = "https://github.com/henrikogaard/gpui-kit", branch = "cursor/inline-html-mark-0bc0" }
gpui-component = { git = "https://github.com/henrikogaard/gpui-kit", branch = "cursor/inline-html-mark-0bc0" }
gpui-kit-assets = { git = "https://github.com/henrikogaard/gpui-kit", branch = "cursor/inline-html-mark-0bc0" }
gpui-component-macros = { git = "https://github.com/henrikogaard/gpui-kit", branch = "cursor/inline-html-mark-0bc0" }
